[project]
name = "tienda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlmodel>=0.0.47",
]

[project.scripts]
tienda = "tienda:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
