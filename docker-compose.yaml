services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://store:${POSTGRES_PASSWORD:-store-local}@db:5432/store
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
